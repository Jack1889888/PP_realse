<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GangQiao 客户与商机销售经营系统</title>
<style>
:root{--nav:#101b31;--nav2:#1c3154;--bg:#f3f6fb;--card:#fff;--line:#dde4ef;--text:#172033;--muted:#6b7890;--blue:#2f6fed;--green:#12875f;--orange:#bf7300;--red:#c33c50}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.login{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;background:linear-gradient(135deg,#0c172a,#183760)}.hero{color:#fff;padding:70px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:40px;margin:18px 0}.hero p{font-size:17px;line-height:1.8;color:#c8d5e8;max-width:650px}.brand{font-weight:900;font-size:30px}.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.tags span{border:1px solid #ffffff2b;border-radius:99px;padding:7px 11px;background:#ffffff0d}.loginbox{margin:34px;background:#fff;border-radius:22px;padding:42px;align-self:center;box-shadow:0 30px 90px #0005}.loginbox h2{margin:0 0 6px}.loginbox p{color:var(--muted)}label{display:block;font-size:13px;font-weight:800;margin:15px 0 7px}.loginbox input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px}.loginbtn{margin-top:18px;width:100%;border:0;background:var(--blue);color:#fff;padding:13px;border-radius:10px;font-weight:800;cursor:pointer}.hint{margin-top:18px;background:#f4f7fc;padding:12px;border-radius:9px;color:#53627b;font-size:13px;line-height:1.7}.error{display:none;color:#a82339;background:#ffecef;padding:10px;border-radius:8px;margin-top:12px}.app{display:none;grid-template-columns:238px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.side h2{margin:0 10px 4px}.side small{color:#aab8ce;margin:0 10px 18px;display:block}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#bec9da;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0}.top h1{font-size:21px;margin:0}.user{background:#edf3ff;color:#2258b7;padding:8px 12px;border-radius:9px;font-weight:800;font-size:13px}.logout{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:8px;cursor:pointer;margin-left:8px}.page{padding:22px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 7px 25px #14233c10}.kpi label{margin:0;color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:27px;margin:8px 0}.kpi span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.card h3{margin:0 0 13px}.toolbar{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#ffecef;color:#a82339}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f6f8fc;color:var(--muted);text-align:left;padding:11px;white-space:nowrap}td{padding:12px 11px;border-bottom:1px solid var(--line)}.tag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:900}.p0{background:#ffe7eb;color:#b3263e}.p1{background:#fff0d4;color:#995f00}.good{background:#e7f7f1;color:#087653}.blue{background:#eaf1ff;color:#235ec7}.alert{border:1px solid var(--line);border-radius:9px;padding:11px;margin:9px 0}.alert b{display:block}.alert small{color:var(--muted);line-height:1.6}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:900px){.login{grid-template-columns:1fr}.hero{display:none}.loginbox{margin:20px}.app{grid-template-columns:76px 1fr}.side h2,.side small,.nav button span{display:none}.nav button{text-align:center}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:560px){.kpis{grid-template-columns:1fr}.page{padding:13px}}
</style>
</head>
<body>
<section id="login" class="login"><div class="hero"><div class="brand">GANGQIAO</div><h1>客户与商机销售经营系统</h1><p>覆盖线索、客户、商机、报价、订单、回款、履约、售后、客户增长、经营分析和老板介入。</p><div class="tags"><span>客户360°</span><span>商机优先级</span><span>报价审批</span><span>订单回款</span><span>履约风险</span><span>老板驾驶舱</span></div></div><div class="loginbox"><h2>登录系统</h2><p>老板最高权限测试入口</p><label>账号</label><input id="u" value="888"><label>密码</label><input id="p" type="password" value="888*888"><button class="loginbtn" onclick="loginNow()">登录</button><div id="err" class="error">账号或密码错误</div><div class="hint">账号：<b>888</b><br>密码：<b>888*888</b><br>权限：老板 / 系统最高权限</div></div></section>
<section id="app" class="app"><aside class="side"><h2>GANGQIAO</h2><small>销售经营系统</small><div id="nav" class="nav"></div></aside><main class="main"><header class="top"><h1 id="title">老板驾驶舱</h1><div><span class="user">888 · 老板</span><button class="logout" onclick="logoutNow()">退出</button></div></header><div id="page" class="page"></div></main></section><div id="toast" class="toast"></div>
<script>
const pages=[['dashboard','驾驶舱','⌂'],['leads','线索','◎'],['customers','客户','▣'],['opps','商机','◇'],['quotes','报价','¥'],['orders','订单回款','▤'],['delivery','履约交付','⇢'],['after','售后增长','♡'],['analytics','经营分析','▥'],['settings','系统管理','⚙']];
const data={leads:[['Urban Steel','商贸城进店','美国','批发商','82','有效线索'],['Aster Accessories','Instagram','法国','品牌客户','74','待调查'],['Belle Mode','邮件开发','德国','电商卖家','66','已联系']],customers:[['Nova Jewelry','美国','品牌客户','S','¥680,000'],['Maison V','法国','连锁客户','A','¥220,000'],['Luna GmbH','德国','批发商','A','¥510,000']],opps:[['Maison V防水新品','O6-样品验证','¥280,000','31%','P0'],['Nova Jewelry首单','O7-商务谈判','¥160,000','28%','P0'],['Luna GmbH补货','O4-需求确认','¥90,000','26%','P1']]};
function loginNow(){if(u.value==='888'&&p.value==='888*888'){login.style.display='none';app.style.display='grid';buildNav();show('dashboard')}else err.style.display='block'}function logoutNow(){app.style.display='none';login.style.display='grid'}
function buildNav(){nav.innerHTML=pages.map((x,i)=>`<button id="n-${x[0]}" onclick="show('${x[0]}')"><b>${x[2]}</b> <span>${x[1]}</span></button>`).join('')}
function show(k){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+k).classList.add('active');title.textContent=pages.find(x=>x[0]===k)[1];({dashboard,leads,customers,opps,quotes,orders,delivery,after,analytics,settings})[k]()}
function tag(t,c){return `<span class="tag ${c}">${t}</span>`}function notify(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function dashboard(){page.innerHTML=`<div class="kpis"><div class="kpi"><label>重点商机金额</label><strong>¥530,000</strong><span>3个重点商机</span></div><div class="kpi"><label>加权成交金额</label><strong>¥348,000</strong><span>按阶段概率计算</span></div><div class="kpi"><label>待收与逾期</label><strong>¥264,000</strong><span>2张订单存在现金暴露</span></div><div class="kpi"><label>老板介入事项</label><strong>4</strong><span>其中P0事项2项</span></div></div><div class="grid"><div class="card"><h3>重点商机战役</h3>${oppTable()}</div><div class="card"><h3>老板介入队列</h3><div class="alert"><b>${tag('P0','p0')} Nova首单价格门禁</b><small>负责人：销售负责人<br>等待老板审批有条件价格方案</small></div><div class="alert"><b>${tag('P1','p1')} Maison V样品延期风险</b><small>负责人：技术支持<br>需今日更新验证进度</small></div></div></div>`}
function leads(){page.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="notify('新建线索表单已打开')">+ 新建线索</button><button class="btn secondary" onclick="notify('线索查重完成')">线索查重</button></div><div class="card"><h3>全部线索</h3><div class="table"><table><tr><th>名称</th><th>来源</th><th>国家</th><th>类型</th><th>评分</th><th>状态</th></tr>${data.leads.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${tag(x[5],x[4]>=80?'good':'blue')}</td></tr>`).join('')}</table></div></div>`}
function customers(){page.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="notify('客户创建表单已打开')">+ 新建客户</button></div><div class="card"><h3>客户360°</h3><div class="table"><table><tr><th>客户</th><th>国家</th><th>类型</th><th>价值等级</th><th>年度金额</th></tr>${data.customers.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${tag(x[3],x[3]==='S'?'p0':'p1')}</td><td><b>${x[4]}</b></td></tr>`).join('')}</table></div></div>`}
function oppTable(){return `<div class="table"><table><tr><th>商机</th><th>阶段</th><th>金额</th><th>毛利</th><th>优先级</th></tr>${data.opps.map(x=>`<tr><td><b>${x[0]}</b></td><td>${tag(x[1],'blue')}</td><td>${x[2]}</td><td>${x[3]}</td><td>${tag(x[4],x[4]==='P0'?'p0':'p1')}</td></tr>`).join('')}</table></div>`}function opps(){page.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="notify('新建商机表单已打开')">+ 新建商机</button><button class="btn secondary" onclick="notify('商机评分已重算')">重算评分</button></div><div class="card"><h3>商机管道</h3>${oppTable()}</div>`}
function quotes(){page.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="notify('报价草稿已创建')">+ 新建报价</button><button class="btn secondary" onclick="notify('审批队列已打开')">审批队列</button></div><div class="card"><h3>报价中心</h3><div class="table"><table><tr><th>报价号</th><th>客户</th><th>金额</th><th>毛利</th><th>状态</th></tr><tr><td><b>Q-2026-018</b></td><td>Nova Jewelry</td><td>¥160,000</td><td>28%</td><td>${tag('待审批','p1')}</td></tr><tr><td><b>Q-2026-017</b></td><td>Maison V</td><td>¥280,000</td><td>31%</td><td>${tag('已发送','blue')}</td></tr></table></div></div>`}
function orders(){page.innerHTML=`<div class="kpis"><div class="kpi"><label>订单金额</label><strong>¥300,000</strong><span>当前2张订单</span></div><div class="kpi"><label>已收金额</label><strong>¥36,000</strong><span>收款进度12%</span></div><div class="kpi"><label>未收金额</label><strong>¥264,000</strong><span>持续跟进</span></div><div class="kpi"><label>逾期金额</label><strong>¥0</strong><span>当前无正式逾期</span></div></div><div class="toolbar"><button class="btn primary" onclick="notify('订单创建入口已打开')">+ 创建订单</button><button class="btn secondary" onclick="notify('回款登记入口已打开')">登记回款</button><button class="btn danger" onclick="notify('退款必须创建反向流水')">退款/冲销</button></div>`}
function delivery(){page.innerHTML=`<div class="card"><h3>SO-2026-0031 履约节点</h3><div class="table"><table><tr><th>节点</th><th>负责人</th><th>状态</th><th>进度</th></tr>${['BOM确认','物料采购','外协加工','半成品质检','成品质检','包装','订舱/快递','发货'].map((x,i)=>`<tr><td><b>${i+1}. ${x}</b></td><td>${i<3?'生产跟单':i<5?'质检':'物流'}</td><td>${tag(i<3?'已完成':i===3?'进行中':'未开始',i<3?'good':i===3?'p1':'blue')}</td><td>${i<3?'100%':i===3?'60%':'0%'}</td></tr>`).join('')}</table></div></div>`}
function after(){page.innerHTML=`<div class="kpis"><div class="kpi"><label>开放售后</label><strong>2</strong><span>P0/P1共1项</span></div><div class="kpi"><label>总体满意度</label><strong>8.7</strong><span>满分10分</span></div><div class="kpi"><label>NPS</label><strong>42</strong><span>持续提升中</span></div><div class="kpi"><label>补货提醒</label><strong>6</strong><span>本月到期3项</span></div></div><div class="card"><h3>售后与客户增长</h3><div class="alert"><b>${tag('P1','p1')} 包装压痕 · Nova Jewelry</b><small>CAPA处理中，等待客户确认</small></div><div class="alert"><b>Luna GmbH补货提醒</b><small>预计采购：2026-08-15<br><button class="btn primary" onclick="notify('已转为增长商机')">转增长商机</button></small></div></div>`}
function analytics(){page.innerHTML=`<div class="kpis"><div class="kpi"><label>线索转客户率</label><strong>28.6%</strong><span>较上期 +4.2%</span></div><div class="kpi"><label>报价接受率</label><strong>33.3%</strong><span>3份报价中1份接受</span></div><div class="kpi"><label>准时交付率</label><strong>92%</strong><span>较上期 +2%</span></div><div class="kpi"><label>复购率</label><strong>37%</strong><span>预计继续提升</span></div></div><div class="card"><h3>资源聚焦建议</h3><div class="alert"><b>${tag('P0','p0')} Maison V防水新品</b><small>高价值、高匹配，建议技术支持优先介入。</small></div></div>`}
function settings(){page.innerHTML=`<div class="grid"><div class="card"><h3>当前测试账号</h3><div class="alert"><b>账号：888</b><small>角色：老板 / 系统所有者<br>数据范围：全公司<br>权限：全部模块与审批</small></div></div><div class="card"><h3>环境说明</h3><p>这是公开浏览器测试页面，数据为测试展示数据，不连接生产数据库。</p></div></div>`}
</script></body></html>
